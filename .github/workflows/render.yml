name: Render wallpaper

on:
  schedule:
    # Hourly at an off-peak minute. GitHub's scheduler often runs jobs hours
    # late or skips them, so frequent runs keep the image fresh regardless.
    - cron: "23 * * * *"
  workflow_dispatch:       # "Run workflow" button for manual refreshes
  push:
    branches: [main]

permissions:
  contents: write      # only for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}current.png
    steps:
      - uses: actions/checkout@v4
      # GitHub disables scheduled jobs after 60 days with no commits.
      # An empty commit every 45 quiet days keeps the schedule alive.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled wallpaper job alive"
            git push
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python render.py --out site/current.png
      - run: echo '<meta http-equiv="refresh" content="0; url=current.png">' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
